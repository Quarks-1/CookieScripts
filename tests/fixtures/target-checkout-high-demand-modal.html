<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"></head>
  <body>
    <div data-test="checkout-container" id="checkout-container">
      <h1>Checkout</h1>
    </div>
    <div class="ReactModal__Overlay">
      <div class="ReactModal__Content" role="dialog" aria-modal="true">
        <button aria-label="close" class="styles_ndsButtonClose" type="button">X</button>
        <h2>High-demand item in your cart.</h2>
        <div data-test="errorContent">
          <span>
            A popular item in your cart is causing a delay. We're managing high traffic
            right now. Please try again.
          </span>
        </div>
        <button type="button">Ok</button>
      </div>
    </div>
  </body>
</html>
