name: Catalog SKU label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-sku-label.yml
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to label retroactively
        required: false

permissions:
  issues: write

jobs:
  ensure-label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure catalog-request label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create catalog-request \
            --repo "${{ github.repository }}" \
            --description "SKU catalog addition request from extension" \
            --color "0E8A16" \
            2>/dev/null || true

  apply-label:
    needs: ensure-label
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[catalog-request]') &&
      github.event.issue.body != null &&
      contains(github.event.issue.body, '<!-- catalog-request-intake -->')
    runs-on: ubuntu-latest
    steps:
      - name: Apply catalog-request label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label catalog-request

      - name: Trigger Cursor webhook
        uses: actions/github-script@v7
        env:
          CURSOR_CATALOG_WEBHOOK_URL: ${{ secrets.CURSOR_CATALOG_WEBHOOK_URL }}
          CURSOR_CATALOG_WEBHOOK_KEY: ${{ secrets.CURSOR_CATALOG_WEBHOOK_KEY }}
        with:
          script: |
            const url = process.env.CURSOR_CATALOG_WEBHOOK_URL;
            const key = process.env.CURSOR_CATALOG_WEBHOOK_KEY;
            if (!url || !key) {
              core.setFailed(
                "CURSOR_CATALOG_WEBHOOK_URL and CURSOR_CATALOG_WEBHOOK_KEY must be set",
              );
              return;
            }

            const issue = context.payload.issue;
            const payload = {
              event: "catalog_request",
              repository: `${context.repo.owner}/${context.repo.repo}`,
              issue_number: issue.number,
              issue_title: issue.title,
              issue_url: issue.html_url,
              issue_body: issue.body,
            };

            const response = await fetch(url, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${key}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Cursor webhook failed: ${response.status} ${text}`);
            }

  apply-label-manual:
    needs: ensure-label
    if: github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue, apply label, trigger webhook
        uses: actions/github-script@v7
        env:
          CURSOR_CATALOG_WEBHOOK_URL: ${{ secrets.CURSOR_CATALOG_WEBHOOK_URL }}
          CURSOR_CATALOG_WEBHOOK_KEY: ${{ secrets.CURSOR_CATALOG_WEBHOOK_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number.parseInt("${{ inputs.issue_number }}", 10);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (!issue.title.startsWith("[catalog-request]")) {
              core.setFailed("Issue title must start with [catalog-request]");
              return;
            }

            if (
              !issue.body ||
              !issue.body.includes("<!-- catalog-request-intake -->")
            ) {
              core.setFailed(
                "Issue body must contain <!-- catalog-request-intake -->",
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["catalog-request"],
            });

            const url = process.env.CURSOR_CATALOG_WEBHOOK_URL;
            const key = process.env.CURSOR_CATALOG_WEBHOOK_KEY;
            if (!url || !key) {
              core.setFailed(
                "CURSOR_CATALOG_WEBHOOK_URL and CURSOR_CATALOG_WEBHOOK_KEY must be set",
              );
              return;
            }

            const payload = {
              event: "catalog_request",
              repository: `${context.repo.owner}/${context.repo.repo}`,
              issue_number: issue.number,
              issue_title: issue.title,
              issue_url: issue.html_url,
              issue_body: issue.body,
            };

            const response = await fetch(url, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${key}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Cursor webhook failed: ${response.status} ${text}`);
            }
