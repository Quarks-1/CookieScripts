name: Catalog SKU automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automerge:
    if: startsWith(github.head_ref, 'catalog/sku-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '^test-and-build$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify only catalog.json changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD)
          if [ "$(echo "$CHANGED" | wc -l | tr -d ' ')" -ne 1 ] || [ "$CHANGED" != "extension/core/data/catalog.json" ]; then
            echo "Unexpected files changed:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready ${{ github.event.pull_request.number }}
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
